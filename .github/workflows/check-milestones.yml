name: Check PL Goal Milestones

on:
  schedule:
    - cron: '0 8 * * 1' # every Monday 08:00 UTC
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test alert using fake data (does not check real stats)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run milestone check
        env:
          TEST_MODE: ${{ github.event.inputs.test || 'false' }}
          RECIPIENTS: "alex.marley@thomaslyte.com,liam.mv@thomaslyte.com"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python scripts/check_milestones.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "Update milestone notification state"
          git push
