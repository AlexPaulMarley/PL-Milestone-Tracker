name: Check PL Goal Milestones

on:
  schedule:
    # GitHub's own docs warn that triggers scheduled for the exact top of the
    # hour (":00") are more likely to be delayed due to load - offsetting by
    # 5 minutes avoids that queueing delay. Both triggers fire every Monday
    # regardless of DST (one always ends up an hour "early"/"late" depending
    # on the time of year) - the script doesn't try to guess which one is
    # "correct" and skip the other, since that guess can itself be defeated
    # by a delayed run. Running the check twice a week is harmless: reached
    # alerts dedupe forever and the digest dedupes per day via
    # data/state.json.
    - cron: '5 4 * * 1' # ~05:05 UK time while BST is in effect
    - cron: '5 5 * * 1' # ~05:05 UK time while GMT is in effect
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a fake [TEST] digest card to prove the Teams pipeline (no real data)'
        type: boolean
        default: false
      dry_run:
        description: 'Run the full scan but print cards to the log instead of posting, and commit nothing'
        type: boolean
        default: false

concurrency:
  group: check-milestones
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Scan all players for milestones
        env:
          TEST_MODE: ${{ github.event.inputs.test || 'false' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: python scripts/check_all_milestones.py

      - name: Commit updated state and spreadsheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/milestone_snapshot.json data/alltime_player_stats.csv data/alltime_player_stats.xlsx
          git diff --cached --quiet || git commit -m "Weekly milestone scan: refresh stats and state"
          git push
