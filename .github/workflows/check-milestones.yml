name: Check PL Goal Milestones

on:
  schedule:
    # GitHub's own docs warn that triggers scheduled for the exact top of the
    # hour (":00") are more likely to be delayed due to load - offsetting by
    # 5 minutes avoids that queueing delay. Both triggers fire every Monday
    # regardless of DST (one always ends up an hour "early"/"late" depending
    # on the time of year) - the script doesn't try to guess which one is
    # "correct" and skip the other, since that guess can itself be defeated
    # by a delayed run. Running the check twice a week is harmless: each
    # milestone only ever alerts once, tracked in data/state.json.
    - cron: '5 4 * * 1' # ~05:05 UK time while BST is in effect
    - cron: '5 5 * * 1' # ~05:05 UK time while GMT is in effect
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test alert using fake data (does not check real stats)'
        type: boolean
        default: false
      debug_all_scorers:
        description: 'Post one alert listing every PL player who has scored this season (real data, ignores milestones) - only runs if the season has started'
        type: boolean
        default: false

concurrency:
  group: check-milestones
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run milestone check
        env:
          TEST_MODE: ${{ github.event.inputs.test || 'false' }}
          DEBUG_ALL_SCORERS: ${{ github.event.inputs.debug_all_scorers || 'false' }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: python scripts/check_milestones.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "Update milestone notification state"
          git push
